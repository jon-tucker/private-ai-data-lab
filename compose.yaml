name: ${COMPOSE_PROJECT_NAME:-oracle-ai-data-platform}

services:
  oracle-db:
    extends:
      file: stacks/oracle-db/compose.yaml
      service: oracle-db
  ollama-rocm:
    extends:
      file: stacks/ollama/compose.yaml
      service: ollama-rocm
  ollama-cpu:
    extends:
      file: stacks/ollama/compose.yaml
      service: ollama-cpu
  open-webui:
    extends:
      file: stacks/open-webui/compose.yaml
      service: open-webui
  ords-install:
    extends:
      file: stacks/ords/compose.yaml
      service: ords-install
  ords:
    extends:
      file: stacks/ords/compose.yaml
      service: ords
  mcp:
    extends:
      file: stacks/mcp/compose.yaml
      service: mcp
  mcp-http:
    extends:
      file: stacks/mcp/compose.yaml
      service: mcp-http
  mcp-tls:
    extends:
      file: stacks/mcp/compose.yaml
      service: mcp-tls
  litellm:
    extends:
      file: stacks/litellm/compose.yaml
      service: litellm

networks:
  frontend:
    name: ${FRONTEND_NETWORK:-oracle-ai-frontend}
    driver: bridge
  backend:
    name: ${BACKEND_NETWORK:-oracle-ai-backend}
    driver: bridge
