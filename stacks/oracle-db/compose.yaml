services:
  oracle-db:
    image: ${ORACLE_DATABASE_IMAGE:-container-registry.oracle.com/database/free:23.26.2.0}
    container_name: ${ORACLE_DATABASE_CONTAINER:-oracle-ai-database}
    hostname: oracle-db
    restart: unless-stopped
    ports:
      - "${ORACLE_DATABASE_HOST_BIND:-0.0.0.0}:${ORACLE_DATABASE_PORT:-1521}:1521"
    environment:
      ORACLE_CHARACTERSET: ${ORACLE_CHARACTERSET:-AL32UTF8}
      ENABLE_ARCHIVELOG: ${ORACLE_ENABLE_ARCHIVELOG:-true}
      ENABLE_FORCE_LOGGING: ${ORACLE_ENABLE_FORCE_LOGGING:-true}
      TZ: ${TZ:-UTC}
    volumes:
      - ${PLATFORM_DATA_ROOT:-/srv/oracle-ai-data}/oracle:/opt/oracle/oradata
      - ./setup:/opt/oracle/scripts/setup:ro
      - ./startup:/opt/oracle/scripts/startup:ro
    networks:
      - backend
    shm_size: ${ORACLE_DATABASE_SHM_SIZE:-2g}
    mem_limit: ${ORACLE_DATABASE_MEMORY:-8g}
    cpus: ${ORACLE_DATABASE_CPUS:-4.0}
    ulimits:
      nofile:
        soft: 1024
        hard: 65536
      nproc:
        soft: 2047
        hard: 16384
      stack:
        soft: 10485760
        hard: 33554432
    labels:
      com.jontucker.oracle-ai-data-platform.component: oracle-db
      com.jontucker.oracle-ai-data-platform.release: "0.2.0"
