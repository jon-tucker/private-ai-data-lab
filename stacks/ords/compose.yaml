services:
  ords-install:
    image: ${ORDS_IMAGE:-container-registry.oracle.com/database/ords:26.2.0}
    container_name: ${ORDS_INSTALL_CONTAINER:-oracle-ai-ords-install}
    user: "54321:54321"
    profiles:
      - ords-install
    entrypoint:
      - /opt/oracle/ords/bin/ords
    command:
      - --config
      - /etc/ords/config
      - install
      - --admin-user
      - SYS
      - --proxy-user
      - --password-stdin
      - --db-hostname
      - oracle-db
      - --db-port
      - "1521"
      - --db-servicename
      - ${ORACLE_PDB:-FREEPDB1}
      - --feature-db-api
      - "true"
      - --feature-rest-enabled-sql
      - "true"
      - --feature-sdw
      - "true"
      - --gateway-mode
      - proxied
      - --log-folder
      - /etc/ords/config/logs
    volumes:
      - ${ORDS_CONFIG_DIR:-/srv/oracle-ai-data/ords}:/etc/ords/config
    networks:
      - backend
    mem_limit: ${ORDS_MEMORY:-2g}
    cpus: ${ORDS_CPUS:-2.0}
    labels:
      com.jontucker.oracle-ai-data-platform.component: ords-install
      com.jontucker.oracle-ai-data-platform.release: "0.5.0"

  ords:
    image: ${ORDS_IMAGE:-container-registry.oracle.com/database/ords:26.2.0}
    container_name: ${ORDS_CONTAINER:-oracle-ai-ords}
    hostname: ords
    user: "54321:54321"
    restart: unless-stopped
    ports:
      - "${ORDS_HOST_BIND:-0.0.0.0}:${ORDS_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${ORDS_CONFIG_DIR:-/srv/oracle-ai-data/ords}:/etc/ords/config
    networks:
      - frontend
      - backend
    mem_limit: ${ORDS_MEMORY:-2g}
    cpus: ${ORDS_CPUS:-2.0}
    healthcheck:
      test:
        - CMD-SHELL
        - "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s
    labels:
      com.jontucker.oracle-ai-data-platform.component: ords
      com.jontucker.oracle-ai-data-platform.release: "0.5.0"
