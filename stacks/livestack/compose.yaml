services:
  livestack:
    profiles: ["livestack"]
    image: ${LIVESTACK_IMAGE:-oracle-ai/livestack-utilities:1.2.1}
    build:
      context: ${LIVESTACK_SOURCE_DIR:-/srv/oracle-ai-work/livestack/utilities}
      dockerfile: Containerfile
    container_name: ${LIVESTACK_CONTAINER:-oracle-ai-livestack}
    hostname: livestack
    restart: unless-stopped
    ports:
      - "${LIVESTACK_HOST_BIND:-127.0.0.1}:${LIVESTACK_PORT:-8505}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: http://${LIVESTACK_HOST_BIND:-127.0.0.1}:${LIVESTACK_PORT:-8505}
      ORACLE_USER: ${LIVESTACK_DATABASE_USER:-LIVESTACK}
      APP_SCHEMA_PASSWORD_FILE: /run/secrets/livestack_database_password
      ORACLE_CONNECTION_STRING: ${LIVESTACK_DATABASE_CONNECT_STRING:-oracle-db:1521/FREEPDB1}
      OLLAMA_BASE_URL: ${LIVESTACK_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${LIVESTACK_OLLAMA_MODEL:-qwen3:4b-instruct}
      DEMO_USAGE_COUNTER_ENABLED: "false"
      DEMO_USAGE_COUNTER_PAR_URL: ""
    secrets:
      - livestack_database_password
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3001/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      com.jontucker.oracle-ai-data-platform.component: livestack
      com.jontucker.oracle-ai-data-platform.release: "1.2.1"

secrets:
  livestack_database_password:
    file: ${LIVESTACK_DATABASE_PASSWORD_FILE:-/srv/oracle-ai-secrets/livestack-database-password}

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-oracle-ai-backend}
