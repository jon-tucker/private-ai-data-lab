services:
  mcp:
    image: ${MCP_SQLCL_IMAGE:-container-registry.oracle.com/database/sqlcl:26.2.0}
    user: "${MCP_UID:-54321}:${MCP_GID:-54321}"
    profiles:
      - mcp
    entrypoint:
      - /opt/oracle/sqlcl/bin/sql
    command:
      - -mcp
    environment:
      HOME: /home/oracle
      TZ: ${TZ:-UTC}
    working_dir: /home/oracle
    volumes:
      - ${MCP_SQLCL_HOME:-/srv/oracle-ai-data/mcp/sqlcl-home}:/home/oracle
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    labels:
      com.jontucker.oracle-ai-data-platform.component: sqlcl-mcp
      com.jontucker.oracle-ai-data-platform.release: "0.7.0"

  mcp-http:
    build:
      context: ../..
      dockerfile: stacks/mcp/Dockerfile.http
      args:
        MCP_SQLCL_IMAGE: ${MCP_SQLCL_IMAGE:-container-registry.oracle.com/database/sqlcl:26.2.0}
        MCP_NODEJS_STREAM: ${MCP_NODEJS_STREAM:-22}
        MCP_SUPERGATEWAY_VERSION: ${MCP_SUPERGATEWAY_VERSION:-3.4.3}
    image: ${MCP_HTTP_IMAGE:-oracle-ai/sqlcl-mcp-http:26.2.0}
    container_name: ${MCP_HTTP_CONTAINER:-oracle-ai-sqlcl-mcp-http}
    user: "${MCP_UID:-54321}:${MCP_GID:-54321}"
    profiles:
      - mcp-http
    command:
      - --stdio
      - /opt/oracle/sqlcl/bin/sql -mcp
      - --outputTransport
      - streamableHttp
      - --stateful
      - --sessionTimeout
      - "${MCP_HTTP_SESSION_TIMEOUT_MS:-600000}"
      - --streamableHttpPath
      - /mcp
      - --healthEndpoint
      - /healthz
      - --port
      - "8181"
      - --logLevel
      - info
    environment:
      HOME: /home/oracle
      TZ: ${TZ:-UTC}
    working_dir: /home/oracle
    volumes:
      - ${MCP_SQLCL_HOME:-/srv/oracle-ai-data/mcp/sqlcl-home}:/home/oracle
    expose:
      - "8181"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8181/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      com.jontucker.oracle-ai-data-platform.component: sqlcl-mcp-http
      com.jontucker.oracle-ai-data-platform.release: "0.9.0"

  mcp-tls:
    image: ${MCP_TLS_IMAGE:-nginx:1.30.4-alpine3.24}
    container_name: ${MCP_TLS_CONTAINER:-oracle-ai-sqlcl-mcp-tls}
    user: "${PLATFORM_UID:-1000}:${PLATFORM_GID:-1000}"
    profiles:
      - mcp-http
    depends_on:
      mcp-http:
        condition: service_healthy
    ports:
      - "${MCP_HTTPS_HOST_BIND:-192.168.122.1}:${MCP_HTTPS_PORT:-8182}:8443"
    volumes:
      - ${MCP_NGINX_CONFIG:-/srv/oracle-ai-data/mcp/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${MCP_TLS_DIR:-/srv/oracle-ai-secrets/mcp-tls}:/etc/nginx/tls:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - --quiet
        - --spider
        - https://127.0.0.1:8443/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      com.jontucker.oracle-ai-data-platform.component: sqlcl-mcp-tls
      com.jontucker.oracle-ai-data-platform.release: "0.9.0"
