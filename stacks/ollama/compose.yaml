x-ollama-common: &ollama-common
  container_name: ${OLLAMA_CONTAINER:-oracle-ai-ollama}
  hostname: ollama
  restart: unless-stopped
  ports:
    - "${OLLAMA_HOST_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
  environment:
    OLLAMA_HOST: 0.0.0.0:11434
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    OLLAMA_MAX_LOADED_MODELS: "1"
    OLLAMA_NUM_PARALLEL: "1"
    TZ: ${TZ:-UTC}
  volumes:
    - ${PLATFORM_DATA_ROOT:-/srv/oracle-ai-data}/ollama:/root/.ollama
  networks:
    backend:
      aliases:
        - ollama
  mem_limit: ${OLLAMA_MEMORY:-12g}
  cpus: ${OLLAMA_CPUS:-8.0}
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 30s
  labels:
    com.jontucker.oracle-ai-data-platform.component: ollama
    com.jontucker.oracle-ai-data-platform.release: "0.3.0"

services:
  ollama-rocm:
    <<: *ollama-common
    image: ${OLLAMA_ROCM_IMAGE:-ollama/ollama:0.32.0-rocm}
    profiles: ["rocm"]
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

  ollama-cpu:
    <<: *ollama-common
    image: ${OLLAMA_CPU_IMAGE:-ollama/ollama:0.32.0}
    profiles: ["cpu"]
