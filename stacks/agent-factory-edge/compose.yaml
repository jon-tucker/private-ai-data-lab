services:
  agent-factory-edge:
    profiles: ["agent-factory-edge"]
    image: ${AGENT_FACTORY_EDGE_IMAGE}
    container_name: ${AGENT_FACTORY_EDGE_CONTAINER}
    user: "${PLATFORM_UID}:${PLATFORM_GID}"
    restart: unless-stopped
    ports:
      - "${AGENT_FACTORY_EDGE_HOST_BIND}:${AGENT_FACTORY_EDGE_PORT}:8443"
    volumes:
      - ${AGENT_FACTORY_EDGE_DATA_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${AGENT_FACTORY_EDGE_TLS_DIR}:/etc/nginx/tls:ro
      - ${AGENT_FACTORY_EDGE_DATA_DIR}/upstream.crt:/etc/nginx/upstream/upstream.crt:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1:8443/agentFactory/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK}
